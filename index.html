<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Rutinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1113; --card:#191c1f; --card2:#22262a; --line:#2d3237;
  --txt:#f2f2ee; --mut:#9aa1a8; --acc:#c6f432; --acc-ink:#15180a;
  --rest:#4cc9f0; --warn:#ff6b4a; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1,h2,.big{font-family:"Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase}
h1{font-size:38px;font-weight:800;margin:6px 0 2px}
h2{font-size:24px;font-weight:800;margin:22px 0 10px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-weight:600;font-size:17px;background:var(--card2);border:1px solid var(--line)}
.btn.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);background:transparent}
.btn.sm{padding:10px 12px;font-size:14px;width:auto}
.row{display:flex;gap:10px}
.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rt{display:flex;align-items:center;gap:12px}
.rt .info{flex:1;min-width:0}
.rt .name{font-weight:600;font-size:18px}
.rt .meta{color:var(--mut);font-size:13px;margin-top:3px}
.play{width:54px;height:54px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mut);flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,19,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;padding:8px;border-radius:12px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--acc)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 5px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:9px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.ex-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ex-h .n{font-family:"Barlow Condensed";font-weight:800;font-size:22px;color:var(--acc);width:28px}
.ex-h .t{flex:1;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.status{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
/* workout */
.wk{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.wk.rest{background:#0b1a21}
.wk-top{display:flex;align-items:center;gap:10px}
.wk-top .lbl{flex:1;color:var(--mut);font-size:14px;text-align:center}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin:12px 0 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.wk.rest .bar i{background:var(--rest)}
.wk-mid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:0}
.phase{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:600}
.wk.rest .phase{color:var(--rest)}
.exname{font-family:"Barlow Condensed";font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;margin:10px 0 6px}
.setinfo{color:var(--mut);font-size:16px}
.bigval{font-family:"Barlow Condensed";font-weight:800;font-size:84px;line-height:1;margin:6px 0 0}
.unit{color:var(--mut);font-size:16px;margin-bottom:12px}
.notes{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:#d6d9dc;font-size:14px;line-height:1.4;text-align:left;margin:8px auto 0;max-width:460px;max-height:15vh;overflow:auto}
.next{color:var(--mut);font-size:14px;margin-top:14px}
.next b{color:var(--txt)}
.wk-bot{display:flex;flex-direction:column;gap:10px}
.huge{padding:22px;font-size:22px;font-family:"Barlow Condensed";font-weight:800;letter-spacing:1px;text-transform:uppercase}
.done-ic{font-size:70px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px}
.hist{display:flex;justify-content:space-between;gap:10px}
.hist .d{color:var(--mut);font-size:13px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed";font-size:32px;font-weight:800;color:var(--acc)}
.stat span{font-size:12px;color:var(--mut)}
.fig{display:block;width:100%;height:auto}
.wkfig{height:25vh;width:auto;max-width:100%;margin:0 auto 4px}
.rfig{height:15vh;width:auto;max-width:100%;margin:8px auto 0;opacity:.9}
.pfig{width:92px;height:92px;flex:none;background:#14171a;border-radius:12px}
.vid{display:inline-flex;gap:6px;align-items:center;color:var(--rest);font-size:14px;font-weight:600;text-decoration:none;margin-top:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pex{display:flex;gap:12px;align-items:flex-start}
.pex .t{font-weight:600}
.pex .d{color:var(--mut);font-size:13px;margin:3px 0 6px}
.pex .nt{font-size:14px;color:#d6d9dc;line-height:1.4}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.sticky .btn{max-width:528px;margin:0 auto}
.chip{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;text-align:left}
.chip small{font-weight:500;font-size:12px;color:var(--mut)}
.chip.on{border-color:var(--acc);background:#20260f}.chip.on small{color:var(--acc)}
.streak{display:flex;gap:14px;align-items:center;background:linear-gradient(160deg,#2a1a0d,#191c1f 65%);border-color:#5a3a18}
.streak .fire{font-size:46px}.streak .d,.card .d{color:var(--mut);font-size:13px}
.ctitle{font-weight:600;text-transform:capitalize;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:13px;color:var(--mut)}
.cd.h{aspect-ratio:auto;font-size:11px}
.cd.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
.cd.td{outline:2px solid var(--rest)}
.sbars{display:flex;gap:8px;margin-top:12px;height:90px}
.sb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.sbt{flex:1;width:100%;background:var(--card2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.sbt i{display:block;width:100%;background:var(--rest);border-radius:8px}
.sb span{font-size:11px;color:var(--mut)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.bd .bi{font-size:30px}.bd b{display:block;font-size:12px;margin-top:4px}.bd span{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.bd.off{opacity:.35;filter:grayscale(1)}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Datos de ejemplo ----------
const uid=()=>Math.random().toString(36).slice(2,10);
const X=(name,type,sets,value,rest,notes)=>({id:uid(),name,type,sets,value,rest,notes});
const R=(day,name,focus,exercises)=>({id:uid(),day,name,focus,exercises});
const PESO=" Elige un peso con el que las últimas 2 reps cuesten trabajo pero sin perder la técnica.";
const ejemplo=()=>[
 R(1,"Lunes · Fuerza A","Cuerpo completo · pierna y empuje",[
  X("Calentamiento en caminadora","time",1,300,30,"Camina rápido o trota suave. Sube la inclinación a 3–5 los últimos 2 minutos."),
  X("Sentadilla goblet con mancuerna","reps",3,12,60,"Sostén una mancuerna vertical pegada al pecho. Pies al ancho de hombros, baja con la espalda recta hasta que los muslos queden paralelos."+PESO),
  X("Press de pecho en máquina","reps",3,12,60,"Ajusta el asiento para que los agarres queden a la altura del pecho. Empuja sin despegar la espalda del respaldo y regresa lento. Si no hay estación de pecho: press con mancuernas acostado en el banco."+PESO),
  X("Jalón al pecho en máquina","reps",3,12,60,"Agarre un poco más abierto que los hombros. Jala la barra hacia la parte alta del pecho apretando la espalda y regresa controlado. Alternativa: remo con mancuerna."+PESO),
  X("Peso muerto rumano con mancuernas","reps",3,12,60,"Rodillas ligeramente flexionadas, lleva la cadera hacia atrás bajando las mancuernas pegadas a las piernas hasta media espinilla. Espalda siempre recta."+PESO),
  X("Press de hombro con mancuernas (sentado en el banco)","reps",3,10,60,"Respaldo del banco vertical. Empuja las mancuernas desde la altura de las orejas hasta arriba sin arquear la espalda."+PESO),
  X("Plancha","time",3,40,30,"Antebrazos en el piso, cuerpo recto, abdomen y glúteos apretados."),
  X("Enfriamiento en bicicleta","time",1,300,0,"Pedalea suave y baja el ritmo poco a poco. Después estira piernas y pecho 1 minuto.")
 ]),
 R(2,"Martes · Fuerza B","Cuerpo completo · espalda y glúteo",[
  X("Calentamiento en elíptica","time",1,300,30,"Ritmo moderado, usa también los brazos."),
  X("Zancadas con mancuernas","reps",3,10,60,"10 por pierna. Paso largo, baja la rodilla de atrás casi al piso. La rodilla de enfrente no pasa la punta del pie."+PESO),
  X("Remo con mancuerna apoyado en el banco","reps",3,12,60,"12 por brazo. Rodilla y mano en el banco, espalda plana. Jala la mancuerna hacia la cadera apretando la espalda."+PESO),
  X("Press de pecho con mancuernas en banco","reps",3,12,60,"Acostado en el banco, baja las mancuernas a los lados del pecho con los codos a unos 45° y empuja hacia arriba."+PESO),
  X("Puente de glúteo con mancuerna (espalda en el banco)","reps",3,15,60,"Parte alta de la espalda apoyada en el banco, mancuerna sobre la cadera. Sube la cadera apretando glúteos y aguanta 1 segundo arriba."+PESO),
  X("Curl de bíceps con mancuernas","reps",3,12,45,"Codos pegados al cuerpo, sube sin balancearte y baja lento."+PESO),
  X("Extensión de tríceps en polea o con mancuerna","reps",3,12,45,"En la polea de la máquina: codos pegados, empuja hacia abajo. Sin polea: una mancuerna con ambas manos detrás de la cabeza."+PESO),
  X("Enfriamiento en caminadora","time",1,300,0,"Camina tranquilo. Después estira espalda y piernas 1 minuto.")
 ]),
 R(3,"Miércoles · Intervalos + circuito","Cuerpo completo · cardio y resistencia",[
  X("Calentamiento en bicicleta","time",1,240,30,"Pedaleo suave subiendo poco a poco la resistencia."),
  X("Sprints en bicicleta","time",6,30,60,"30 s pedaleando lo más fuerte que puedas con resistencia media-alta. En el descanso sigue pedaleando muy suave."),
  X("Sentadilla con press de hombro (mancuernas)","reps",3,12,45,"Mancuernas a la altura de los hombros. Baja en sentadilla y al subir empuja las mancuernas arriba en un solo movimiento."+PESO),
  X("Remo sentado en máquina (polea baja)","reps",3,12,45,"Pecho alto, jala el agarre hacia el abdomen juntando los omóplatos. Alternativa: remo con mancuernas inclinado."+PESO),
  X("Lagartijas","reps",3,12,45,"Cuerpo recto. Si cuesta, apoya las manos en el banco o las rodillas en el piso."),
  X("Swing con mancuerna","reps",3,15,45,"Sujeta una mancuerna con ambas manos. Empuja la cadera hacia atrás y luego adelante con fuerza para subirla a la altura del pecho. La fuerza viene de la cadera, no de los brazos."+PESO),
  X("Escaladores (mountain climbers)","time",3,30,30,"Manos en el piso o en el banco, lleva las rodillas al pecho alternando rápido."),
  X("Enfriamiento en elíptica","time",1,300,0,"Ritmo muy suave. Después estira 1 minuto.")
 ]),
 R(4,"Jueves · Fuerza C","Cuerpo completo · pierna a una pierna y hombro",[
  X("Calentamiento en caminadora inclinada","time",1,300,30,"Inclinación 6–10, camina a ritmo cómodo."),
  X("Sentadilla búlgara con pie en el banco","reps",3,10,60,"10 por pierna. Empeine de atrás sobre el banco, mancuernas a los lados. Baja recto, peso en la pierna de enfrente."+PESO),
  X("Press inclinado con mancuernas","reps",3,12,60,"Respaldo del banco a unos 30–45°. Empuja las mancuernas hacia arriba y baja controlado."+PESO),
  X("Jalón al pecho agarre cerrado","reps",3,12,60,"En la máquina, manos juntas o agarre neutro. Jala hacia el pecho bajando los hombros."+PESO),
  X("Subidas al banco con mancuernas (step-up)","reps",3,10,60,"10 por pierna. Sube empujando con el talón de la pierna que está arriba, sin impulsarte con la de abajo."+PESO),
  X("Elevaciones laterales con mancuernas","reps",3,12,45,"Codos un poco doblados, sube los brazos a los lados hasta la altura de los hombros. Peso ligero."),
  X("Crunch en el piso o en banco","reps",3,15,30,"Sube los hombros apretando el abdomen, sin jalar el cuello."),
  X("Enfriamiento en bicicleta","time",1,300,0,"Pedalea suave. Después estira cadera y hombros 1 minuto.")
 ]),
 R(5,"Viernes · Fuerza D","Cuerpo completo · máquina y fuerza total",[
  X("Calentamiento en elíptica","time",1,300,30,"Ritmo moderado."),
  X("Peso muerto con mancuernas","reps",3,10,75,"Mancuernas al frente de las piernas. Baja llevando la cadera atrás y doblando rodillas, espalda recta, y sube empujando el piso."+PESO),
  X("Press de pecho en máquina","reps",3,10,60,"Un poco más de peso que el lunes si te sentiste bien."+PESO),
  X("Remo sentado en máquina","reps",3,10,60,"Pecho alto, junta omóplatos al jalar."+PESO),
  X("Extensión de piernas en máquina","reps",3,12,45,"Si tu máquina tiene estación de piernas: extiende las rodillas y baja lento. Alternativa: sentadilla goblet."+PESO),
  X("Press Arnold con mancuernas","reps",3,10,60,"Sentado en el banco. Empieza con las palmas hacia ti y gíralas hacia afuera mientras empujas arriba."+PESO),
  X("Plancha lateral","time",3,30,30,"30 s por lado (cambia de lado a la mitad del tiempo o haz cada lado en una serie)."),
  X("Enfriamiento en caminadora","time",1,300,0,"Camina suave. Después estira 1 minuto.")
 ]),
 R(6,"Sábado · Cardio + core","Cuerpo completo · más ligero",[
  X("Caminadora inclinada","time",1,1200,60,"20 minutos. Inclinación 8–12 y velocidad a la que puedas hablar con algo de esfuerzo."),
  X("Sentadilla con peso corporal","reps",2,20,30,"Ritmo constante, buena técnica."),
  X("Lagartijas","reps",2,12,30,"En el piso o con manos en el banco."),
  X("Bicho muerto (dead bug)","reps",2,12,30,"Boca arriba, brazos y piernas arriba. Baja brazo y pierna contraria sin despegar la espalda baja del piso."),
  X("Plancha","time",2,45,30,"Cuerpo recto, abdomen apretado."),
  X("Elíptica suave","time",1,360,0,"6 minutos de ritmo cómodo para cerrar.")
 ]),
 R(0,"Domingo · Recuperación activa","Cuerpo completo · movilidad",[
  X("Caminata en caminadora","time",1,900,30,"15 minutos de caminata tranquila, sin inclinación o muy poca."),
  X("Bicicleta suave","time",1,600,30,"10 minutos con poca resistencia."),
  X("Estiramiento de piernas (cuádriceps y femorales)","time",2,60,10,"30 s cada pierna. Sin rebotes."),
  X("Estiramiento de cadera y glúteo","time",2,60,10,"Sentado o en el banco, cruza el tobillo sobre la rodilla contraria e inclínate un poco. 30 s por lado."),
  X("Estiramiento de pecho y hombros","time",2,60,10,"Brazo apoyado en una pared o máquina, gira el cuerpo hacia el lado contrario. 30 s por lado."),
  X("Rotaciones de espalda (gato-vaca)","time",2,60,10,"En cuatro puntos, arquea y redondea la espalda lento con la respiración."),
  X("Respiración y estiramiento libre","time",1,180,0,"Acostado, respira profundo y estira lo que sientas tenso.")
 ])
];
const SEEDV=2;
// ---------- Estado y guardado ----------
let S={routines:[],history:[]};
let db=null, docRef=null, saveTimer=null, syncMsg="Guardado en este teléfono";
const LS="misrutinas_v1";
function lsGet(){try{const v=localStorage.getItem(LS);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function save(){
  lsSet();
  if(!docRef)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await docRef.set(Object.assign({},S,{history:S.history.slice(0,300),seedV:S.seedV||SEEDV,updated:Date.now()}));syncMsg="Guardado en tu cuenta ✓";}
    catch(e){syncMsg="Guardado solo en este teléfono";}
    if(view==="home"||view==="hist")render();
  },600);
}
const local=lsGet();
if(local&&local.routines){S=local}else{S.routines=ejemplo()}
if(S.seedV!==SEEDV){S.routines=ejemplo();S.seedV=SEEDV;lsSet()}

(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    db=await claude.use("db"); const user=await claude.use("user");
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    docRef=db.collection("data/users/"+id).doc("estado");
    const snap=await docRef.get();
    const d=snap&&(typeof snap.data==="function"?snap.data():snap);
    if(d&&d.routines&&d.seedV===SEEDV){S=Object.assign({},d,{history:d.history||[]});lsSet();}
    else{if(d&&d.history&&!S.history.length)S.history=d.history;S.routines=S.seedV===SEEDV?S.routines:ejemplo();S.seedV=SEEDV;save();}
    syncMsg="Guardado en tu cuenta ✓";
    if(view!=="workout")render();
  }catch(e){}
})();

// ---------- Utilidades ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60),r=s%60;return m?`${m}:${String(r).padStart(2,"0")}`:`${r}`};
function estMin(r){let t=0;exsFor(r).forEach(e=>{t+=e.sets*((e.type==="time"?e.value:e.value*3)+e.rest)});return Math.max(1,Math.round(t/60))}
let actx=null;
function beep(f=880,d=.15,n=1){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*(d+.08);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(n>1?[150,80,150]:120)}catch(e){}}
let wakeLock=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen")}else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

// ---------- Dibujos animados de ejercicios ----------
const ST={h:[100,38],n:[100,52],p:[100,105],k1:[102,142],a1:[102,178],k2:[98,142],a2:[98,178],e1:[102,80],w1:[103,106],e2:[98,80],w2:[97,106]};
const P=(b,o)=>Object.assign({},b,o);

function ik(H,F,L1,L2,fwd){
 const dx=F[0]-H[0],dy=F[1]-H[1];let d=Math.hypot(dx,dy);d=Math.min(d,L1+L2-0.01);
 const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
 const mx=H[0]+a*dx/d,my=H[1]+a*dy/d;
 const k1=[mx+h*dy/d,my-h*dx/d],k2=[mx-h*dy/d,my+h*dx/d];
 return (k1[0]>k2[0])===fwd?k1:k2;
}

function sheet(html){const m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML=`<div class="sheet">${html}</div>`;m.onclick=e=>{if(e.target===m)closeSheet()};document.body.appendChild(m)}

// ---------- Modo quemar grasa, voz y utilidades ----------
const isCardio=e=>["walk","ellip","bike","sprint"].includes(animFor(e.name));
function exsFor(r){
  if(!S.burn)return r.exercises;
  const ex=r.exercises.map(e=>isCardio(e)||animFor(e.name)==="breathe"||/estira/i.test(e.name)?e:Object.assign({},e,{rest:Math.max(20,Math.round(e.rest*0.65))}));
  if(ex.some(e=>e.type==="reps")){
    const extra={id:"extra",name:"Cardio extra en caminadora inclinada",type:"time",sets:1,value:600,rest:20,notes:"Modo quemar grasa: inclinación 8–12, a un paso rápido que te deje hablar con esfuerzo. Aquí es donde más grasa quemas después de las pesas."};
    const last=ex[ex.length-1];
    if(last&&/enfriamiento/i.test(last.name))ex.splice(ex.length-1,0,extra);else ex.push(extra);
  }
  return ex;
}
const voiceOn=()=>S.voice!==false;
let esVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();esVoice=v.find(x=>/es[-_](MX|US)/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){if(!voiceOn())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=esVoice?esVoice.lang:"es-MX";if(esVoice)u.voice=esVoice;u.rate=1.02;speechSynthesis.speak(u)}catch(e){}}
function toggle(k){S[k]=k==="voice"?!voiceOn():!S[k];save();render();if(k==="voice"&&voiceOn())say("Voz activada")}
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function streaks(){
  const days=new Set(S.history.map(x=>dkey(x.date)));
  let cur=0,d=new Date();d.setHours(12,0,0,0);
  if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){cur++;d.setDate(d.getDate()-1)}
  const sorted=[...days].sort();let best=0,run=0,prev=null;
  sorted.forEach(k=>{const t=new Date(k+"T12:00:00");run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=t});
  return {cur,best,days};
}
const BADGES=[
 ["first","🎉","Primer entrenamiento","Terminaste tu primera rutina",s=>s.total>=1],

 ["w50","🦾","50 entrenamientos","Máquina",s=>s.total>=50],

 ["s3","🔥","Racha de 3 días","3 días seguidos",s=>s.best>=3],
 ["s7","⚡","Semana perfecta","7 días seguidos",s=>s.best>=7],
 ["s14","🚀","Racha de 14 días","2 semanas sin fallar",s=>s.best>=14],
 ["s30","🏆","Racha de 30 días","Un mes completo",s=>s.best>=30],

function bStats(){
  const st=streaks(),steps=Object.values(S.steps||{}),goal=S.stepGoal||8000;
  return {total:S.history.length,best:st.best,burn:S.history.filter(x=>x.burn).length,
   maxSteps:Math.max(0,...steps),goalDays:steps.filter(n=>n>=goal).length,
   early:S.history.some(x=>new Date(x.date-(x.dur||0)*1000).getHours()<7),
   night:S.history.some(x=>new Date(x.date).getHours()>=21),

function newBadges(){const st=bStats(),got=S.badges||[],nw=BADGES.filter(b=>b[4](st)&&!got.includes(b[0]));S.badges=got.concat(nw.map(b=>b[0]));return nw}
function setSteps(){const el=$("#stepsIn"),n=parseInt(el&&el.value,10);if(!(n>=0))return;S.steps=S.steps||{};S.steps[dkey(Date.now())]=n;const nw=newBadges();save();render();if(nw.length)showBadges(nw)}
function setGoal(){const el=$("#goalIn"),n=parseInt(el&&el.value,10);if(n>0){S.stepGoal=n;save();closeSheet();render()}}
function showBadges(nw){sheet(`<div style="text-align:center"><div style="font-size:56px">${nw.map(b=>b[1]).join(" ")}</div><h2 style="margin:8px 0 4px">¡Nuevo logro!</h2>${nw.map(b=>`<p class="sub" style="margin:4px 0"><b style="color:var(--txt)">${b[2]}</b> · ${b[3]}</p>`).join("")}<div style="height:10px"></div><button class="btn acc" onclick="closeSheet()">¡Vamos!</button></div>`)}

// ---------- Entrenamiento paso a paso ----------
function buildSteps(exs){
  const st=[];
  exs.forEach((e,ei)=>{for(let s=1;s<=e.sets;s++){
    st.push({k:"work",e,ei,s});
    const last=ei===exs.length-1&&s===e.sets;
    if(!last&&e.rest>0)st.push({k:"rest",e,ei,s,dur:e.rest});
  }});
  return st;
}
function startW(id){
  const r=S.routines.find(x=>x.id===id);if(!r||!r.exercises.length)return;
  beep(1,.001); // desbloquea audio
  const exs=exsFor(r);say("Prepárate. "+exs[0].name);
  W={r,exs,burn:!!S.burn,steps:buildSteps(exs),i:-1,start:Date.now(),left:0,paused:false,finished:false};
  view="workout";keepAwake(true);
  countdown();
}
function countdown(){ // 3-2-1 inicial
  W.pre=3;render();clearInterval(tick);beep(660,.12);
  tick=setInterval(()=>{W.pre--;if(W.pre<=0){clearInterval(tick);W.pre=null;goStep(0)}else{beep(660,.12);render()}},1000);
}
function cur(){return W.steps[W.i]}
function goStep(i){
  clearInterval(tick);
  if(i>=W.steps.length){finishW();return}
  if(i<0)i=0;
  W.i=i;W.paused=false;const s=cur();
  if(s.k==="rest"){W.left=s.dur;beep(520,.2);const nx=nextWork();say("Descanso, "+s.dur+" segundos."+(nx?" Sigue: "+nx.e.name+".":""))}
  else{beep(990,.15,2);W.left=s.e.type==="time"?s.e.value:null;const e=s.e;
    say(e.name+". "+(e.sets>1?"Serie "+s.s+" de "+e.sets+". ":"")+(e.type==="reps"?e.value+" repeticiones.":(e.value>=60?Math.round(e.value/60)+" minutos.":e.value+" segundos.")))}
  render();
  if(W.left!=null)runTimer();
}
function runTimer(){
  clearInterval(tick);
  let endAt=Date.now()+W.left*1000;
  tick=setInterval(()=>{
    if(W.paused){endAt=Date.now()+W.left*1000;return}
    const l=Math.ceil((endAt-Date.now())/1000);
    if(l!==W.left){W.left=l;if(l===10&&cur().k==="work"&&cur().e.value>=30)say("Quedan 10 segundos");if(l<=3&&l>0)beep(700,.08);updT()}
    if(l<=0){clearInterval(tick);goStep(W.i+1)}
  },200);
}
function updT(){const el=$("#bigval");if(el)el.textContent=fmt(W.left)}
function pauseW(){W.paused=!W.paused;render()}
function addRest(){W.left+=15;updT()}
function nextWork(){for(let j=W.i+1;j<W.steps.length;j++)if(W.steps[j].k==="work")return W.steps[j];return null}
function exitW(){sheet(`<h2 style="margin-top:0">¿Terminar entrenamiento?</h2><p class="sub">Puedes guardarlo en tu historial aunque no lo hayas completado.</p>
 <button class="btn acc" onclick="closeSheet();finishW(true)">Guardar y salir</button><div style="height:8px"></div>
 <div class="row"><button class="btn" onclick="closeSheet()">Seguir</button><button class="btn" style="color:var(--warn)" onclick="closeSheet();quitW()">Salir sin guardar</button></div>`)}
function quitW(){clearInterval(tick);keepAwake(false);W=null;go("home")}
function finishW(partial){
  clearInterval(tick);keepAwake(false);
  const done=W.steps.slice(0,partial?W.i:W.steps.length).filter(s=>s.k==="work").length;
  const total=W.steps.filter(s=>s.k==="work").length;
  W.finished=true;W.dur=Math.round((Date.now()-W.start)/1000);
  S.history.unshift({id:uid(),routine:W.r.name,date:Date.now(),dur:W.dur,sets:done,total,burn:W.burn});
  W.newB=newBadges();
  save();
  if(!partial){beep(880,.25,3);say("¡Entrenamiento terminado! Buen trabajo."+(W.newB.length?" Ganaste un nuevo logro.":""))}
  render();
}
function wkV(){
  if(W.pre!=null)return `<div class="wk"><div class="wk-mid"><div class="phase">Prepárate</div><div class="exname">${esc(W.exs[0].name)}</div><div class="bigval">${W.pre}</div></div></div>`;
  if(W.finished){

     <div class="setinfo">${esc(W.r.name)}</div>
     <div class="stat" style="margin-top:24px"><div><b>${fmt(W.dur)}</b><span>${W.dur>=60?"min":"seg"}</span></div><div><b>${h.sets}</b><span>series</span></div><div><b>${streaks().cur}</b><span>días de racha 🔥</span></div></div>
     ${(W.newB||[]).map(b=>`<div class="card" style="display:flex;gap:12px;align-items:center;text-align:left;margin-top:8px"><span style="font-size:34px">${b[1]}</span><div><div style="font-weight:600">¡Nuevo logro! ${b[2]}</div><div class="d" style="color:var(--mut);font-size:13px">${b[3]}</div></div></div>`).join("")}</div>
     <div class="wk-bot"><button class="btn acc huge" onclick="W=null;go('home')">Listo</button></div></div>`;
  }
  const s=cur(),e=s.e,works=W.steps.filter(x=>x.k==="work").length;
  const doneW=W.steps.slice(0,W.i).filter(x=>x.k==="work").length;
  const pct=Math.round(doneW/works*100);

  if(s.k==="rest"){
    return `<div class="wk rest">${top}
     <div class="wk-mid"><div class="phase">Descanso</div>
      <div class="bigval" id="bigval">${fmt(W.left)}</div><div class="unit">segundos</div>
      ${nx?figHTML(nx.e.name,"rfig"):""}
      ${nx?`<div class="next">Sigue: <b>${esc(nx.e.name)}</b> · serie ${nx.s}/${nx.e.sets} · ${nx.e.type==="reps"?nx.e.value+" reps":fmt(nx.e.value)+" s"}</div>`:""}
     </div>
     <div class="wk-bot"><div class="row"><button class="btn" onclick="addRest()">+15 s</button><button class="btn" onclick="pauseW()">${W.paused?"Reanudar":"Pausa"}</button></div>
      <button class="btn acc huge" style="background:var(--rest);border-color:var(--rest)" onclick="goStep(W.i+1)">Saltar descanso</button></div></div>`;
  }
  const timed=e.type==="time";
  return `<div class="wk">${top}
   <div class="wk-mid">${figHTML(e.name,"wkfig")}<div class="phase">Serie ${s.s} de ${e.sets}</div>
    <div class="exname">${esc(e.name)}</div>
    <div class="bigval" id="bigval">${timed?fmt(W.left):e.value}</div>
    <div class="unit">${timed?(e.value>=60?"minutos":"segundos"):"repeticiones"}</div>
    ${e.notes?`<div class="notes">${esc(e.notes)}</div>`:""}
    <div><a class="vid" href="${vidURL(e.name)}" target="_blank" rel="noopener">▶ Ver video</a></div>
    ${nx&&nx.e!==e?`<div class="next">Después: <b>${esc(nx.e.name)}</b></div>`:""}
   </div>
   <div class="wk-bot">
    ${timed?`<div class="row"><button class="btn" onclick="pauseW()">${W.paused?"Reanudar":"Pausa"}</button><button class="btn" onclick="goStep(W.i+1)">Saltar</button></div>`:""}
    ${timed?"":`<button class="btn acc huge" onclick="goStep(W.i+1)">✓ Serie hecha</button>`}
   </div></div>`;
}

// ---------- Historial ----------
function histV(){
  const h=S.history,st=streaks(),goal=S.stepGoal||8000,steps=S.steps||{};
  const wk=Date.now()-7*864e5,thisWeek=h.filter(x=>x.date>=wk).length;
  const totMin=Math.round(h.reduce((a,x)=>a+x.dur,0)/60);
  // calendario del mes
  const now=new Date(),y=now.getFullYear(),mo=now.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate();
  let cal="";["L","M","M","J","V","S","D"].forEach(d=>cal+=`<div class="cd h">${d}</div>`);
  for(let i=0;i<first;i++)cal+='<div class="cd"></div>';
  for(let d=1;d<=nd;d++){const k=dkey(new Date(y,mo,d,12).getTime()),on=st.days.has(k),td=d===now.getDate();cal+=`<div class="cd ${on?"on":""} ${td?"td":""}">${d}</div>`}
  // pasos 7 días
  const today=dkey(Date.now());let bars="";
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d.getTime()),n=steps[k]||0,pc=Math.min(100,n/goal*100);
    bars+=`<div class="sb"><div class="sbt"><i style="height:${pc}%;${n>=goal?"background:var(--acc)":""}"></i></div><span>${"DLMMJVS"[d.getDay()]}</span></div>`}
  const st2=bStats(),got=S.badges||[];
  const badges=BADGES.map(b=>{const ok=got.includes(b[0])||b[4](st2);return `<div class="bd ${ok?"":"off"}"><div class="bi">${b[1]}</div><b>${b[2]}</b><span>${b[3]}</span></div>`}).join("");
  const nOk=BADGES.filter(b=>got.includes(b[0])||b[4](st2)).length;
  const items=h.slice(0,40).map(x=>{const d=new Date(x.date);
    return `<div class="card hist"><div><div style="font-weight:600">${x.burn?"🔥 ":""}${esc(x.routine)}</div><div class="d">${d.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"})} · ${d.toLocaleTimeString("es-MX",{hour:"numeric",minute:"2-digit"})}</div></div>
     <div style="text-align:right"><div style="font-weight:600">${fmt(x.dur)}${x.dur>=60?" min":" s"}</div><div class="d">${x.sets}/${x.total} series</div></div></div>`}).join("");
  return `<div class="wrap"><h1>Progreso</h1>
   <div class="card streak"><div class="fire">🔥</div><div><div class="big" style="font-size:44px;font-weight:800;line-height:1">${st.cur} <span style="font-size:20px">día${st.cur===1?"":"s"}</span></div><div class="d">Racha actual · mejor racha: ${st.best}</div></div></div>
   <div class="card"><div class="ctitle">${now.toLocaleDateString("es-MX",{month:"long",year:"numeric"})}</div><div class="cal">${cal}</div></div>
   <div class="stat"><div><b>${thisWeek}</b><span>esta semana</span></div><div><b>${h.length}</b><span>en total</span></div><div><b>${totMin}</b><span>minutos</span></div></div>
   <h2>Pasos de hoy</h2>
   <div class="card">
    <div class="row" style="align-items:center"><input id="stepsIn" type="number" inputmode="numeric" placeholder="Ej. 8500" value="${steps[today]??""}"><button class="btn acc sm" style="flex:none;padding:12px 18px" onclick="setSteps()">Guardar</button></div>
    <div class="d" style="margin:8px 0 2px">Copia el número de la app Salud de tu teléfono. Meta: <b style="color:var(--txt)">${goal.toLocaleString("es-MX")}</b> · <a href="#" onclick="event.preventDefault();sheet('<h2 style=&quot;margin-top:0&quot;>Meta de pasos</h2><input id=&quot;goalIn&quot; type=&quot;number&quot; inputmode=&quot;numeric&quot; value=&quot;${goal}&quot;><div style=&quot;height:10px&quot;></div><button class=&quot;btn acc&quot; onclick=&quot;setGoal()&quot;>Guardar</button>')" style="color:var(--rest)">cambiar</a></div>
    <div class="sbars">${bars}</div></div>
   <h2>Logros <span style="color:var(--mut);font-size:16px">${nOk}/${BADGES.length}</span></h2>
   <div class="badges">${badges}</div>
   <h2>Historial</h2>
   ${items||'<div class="empty">Cuando termines tu primera rutina aparecerá aquí.</div>'}
   <div class="status">${esc(syncMsg)}</div></div>${tabs()}`;
}

render();
</script>
</body>
</html>
